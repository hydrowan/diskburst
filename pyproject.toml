[project]
name = "diskburst"
version = "0.5.0"
description = "Read-only disk usage scanner with a sunburst UI on localhost"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4",  # live mode (FSEvents); the app runs without it, live mode off
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false  # run from the repo root; nothing to build or install

